plugins {
    id 'com.android.application'
}

android {
    namespace 'org.daoyou.app'
    compileSdk 35

    defaultConfig {
        applicationId 'org.daoyou.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        def webUrl = (project.findProperty('daoyouWebUrl') ?: 'https://client.daoyou.org/login').toString()
                .replace('\\', '\\\\').replace('"', '\\"')
        buildConfigField 'String', 'DAOYOU_WEB_URL', "\"${webUrl}\""
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    // AndroidX 当前已将 JDK7/JDK8 扩展合并进 kotlin-stdlib，排除旧版分裂包避免重复类。
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.15.0'
}
