name: Build Android App

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: '道友前端地址'
        required: false
        default: 'https://client.daoyou.org/login'
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: android
        env:
          DAOYOU_WEB_URL: ${{ inputs.web_url || 'https://client.daoyou.org/login' }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PdaoyouWebUrl="$DAOYOU_WEB_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: daoyou-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
